[package]
name = "tack-cli"
version = "0.1.4"
description = "CLI for tack task manager"
edition = "2021"

[[bin]]
name = "tack"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
