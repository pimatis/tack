<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.png" type="image/png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#242424" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Tack" />
		<title>Tack</title>
		<style>
			/* pre-paint background, mirrors the tokens in layout.css so the
			   window never flashes white before the stylesheet loads */
			html,
			body {
				background: #242424;
			}
			html:not(.dark) body {
				background: #fafafa;
			}
		</style>
		<script>
			// apply the saved theme before first paint to avoid a light/dark flash
			try {
				var saved = JSON.parse(localStorage.getItem('tack-settings') || '{}');
				var theme = saved.theme || 'dark';
				if (theme === 'system') {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				if (theme === 'light') {
					document.documentElement.classList.remove('dark');
				} else {
					document.documentElement.classList.add('dark');
				}
				// color preset (Settings -> Themes); `default` means no override
				if (saved.themePreset && saved.themePreset !== 'default') {
					document.documentElement.setAttribute('data-theme', saved.themePreset);
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
