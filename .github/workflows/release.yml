name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build (e.g. 0.2.0). Tag will be v{VERSION}."
        required: true
        type: string
        default: "0.1.0"

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Must be a valid semver string (e.g. 0.1.0)."
            exit 1
          fi
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i '' "s/^version = .*/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          git commit -am "Bump v$VERSION"
          git push origin "${{ github.ref_name }}"
          echo "version bumped to $VERSION"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install

      - name: Build and publish release (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ github.event.inputs.version }}
          releaseName: "Tack v${{ github.event.inputs.version }}"
          releaseBody: "See the assets to download and install this version. See CHANGELOG or release notes for details."
          releaseDraft: true
          prerelease: false
